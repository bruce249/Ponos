  - type: web
    name: ponos-byline-web
    runtime: node
    repo: https://github.com/m-pandey5/Ponos
    branch: muskan
    region: singapore
    plan: 0.5c-512mb
    healthCheckPath: /
    # API_URL is read when Next loads next.config.ts. Render injects service
    # env vars for the build, so the rewrite target is the public API URL.
    buildCommand: npm ci --include=dev && npm run build -w @byline/web
    startCommand: bash -c 'cd apps/web && exec npx --no-install next start -H 0.0.0.0 -p "$PORT"'
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.21.0"
      - key: API_URL
        value: https://ponos-byline-api.onrender.com
