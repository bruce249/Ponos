# Render Blueprint for Ponos / Byline Work. Reference only: the live services
# were created with `render services create` and are not linked to a Blueprint,
# so editing this file does not change them. Deploys are triggered by hand
# (`render deploys create <service> --commit <sha>`).
#
# Live: https://ponos-byline-web.onrender.com (web)
#       https://ponos-byline-api.onrender.com (API)
#
# No secrets in this file. Every key and account credential is `sync: false`
# and set in the Render dashboard from the local .env.
#
# Two public hosts. The browser only talks to the web host. Next rewrites
# /api/* and /x402/* to API_URL (see apps/web/next.config.ts). The session
# cookie bw_session is host-only (no Domain), SameSite=Lax, Secure when
# SESSION_SECURE=true. onrender.com is a public suffix, so the API host
# cannot share that cookie. WORLD_REDIRECT_URI is therefore the web origin
# plus /api/world/callback, and the API redirects back to WEB_ORIGIN/work.
#
# SQLite is ephemeral unless the API disk below is attached. DB_PATH is on
# that disk. A disk forces a single instance and a short gap on each deploy.

services:
  - type: web
    name: ponos-byline-api
    runtime: node
    repo: https://github.com/m-pandey5/Ponos
    branch: muskan
    region: singapore
    plan: 0.5c-512mb
    healthCheckPath: /api/health
    buildCommand: npm ci --include=dev
    startCommand: npm run start:api
    autoDeployTrigger: commit
    disk:
      name: ponos-sqlite
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22.21.0"
      - key: SESSION_SECURE
        value: "true"
      - key: DB_PATH
        value: /var/data/byline-work.db
      - key: WEB_ORIGIN
        value: https://ponos-byline-web.onrender.com
      - key: WORLD_REDIRECT_URI
        value: https://ponos-byline-web.onrender.com/api/world/callback
      - key: API_PUBLIC_URL
        value: https://ponos-byline-api.onrender.com
      # Filled from the local .env after login. Values are not in this file.
      # Do not set PORT (Render assigns it). Do not copy the local WEB_ORIGIN,
      # WORLD_REDIRECT_URI, API_PUBLIC_URL, DB_PATH, or SESSION_SECURE.
      - key: HEDERA_NETWORK
        sync: false
      - key: HEDERA_JSON_RPC
        sync: false
      - key: OPERATOR_ACCOUNT_ID
        sync: false
      - key: OPERATOR_PRIVATE_KEY
        sync: false
      - key: HCS_TOPIC_ID
        sync: false
      - key: X402_FACILITATOR_URL
        sync: false
      - key: SCS_FACTORY_ADDRESS
        sync: false
      - key: SCS_RESOLVER_ADDRESS
        sync: false
      - key: BUSD_TOKEN_ID
